[project]
name = "neuroklakson"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.4,<4",
    "aiosqlite>=0.20,<1",
    "asyncpg>=0.29,<1",
    "markovify>=0.9,<1",
    "pillow>=10,<11",
    "gtts>=2.5,<3",
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28.1",
    "pymorphy3>=2,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.23,<1",
    "ruff>=0.5,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
